<title>Forecasters Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --ground: #f3f4f1;
    --surface: #fcfcfa;
    --surface-2: #e9ebe6;
    --ink: #171a18;
    --ink-mid: #5a605b;
    --ink-soft: #8d948e;
    --line: #dcded8;
    --line-firm: #c3c7bf;
    --accent: #3a34c9;
    --accent-wash: #e7e6fb;

    --late: #c33a28;
    --warn: #a6741a;
    --ok: #2e6b4f;
    --info: #2c5c93;
    --violet: #6b4fc0;
    --teal: #17706c;
    --rose: #a83a63;

    --display: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --body: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --rail: 236px;
  }

  :root:not([data-theme="light"]) {
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121513;
      --surface: #1a1e1b;
      --surface-2: #232824;
      --ink: #eceee9;
      --ink-mid: #a3aaa4;
      --ink-soft: #7b827c;
      --line: #2c322d;
      --line-firm: #3d443e;
      --accent: #9a95ff;
      --accent-wash: #23224a;

      --late: #f08573;
      --warn: #dfae56;
      --ok: #6bbf93;
      --info: #7aa9dd;
      --violet: #a893f0;
      --teal: #5cb5b0;
      --rose: #e089a8;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ground: #121513;
    --surface: #1a1e1b;
    --surface-2: #232824;
    --ink: #eceee9;
    --ink-mid: #a3aaa4;
    --ink-soft: #7b827c;
    --line: #2c322d;
    --line-firm: #3d443e;
    --accent: #9a95ff;
    --accent-wash: #23224a;

    --late: #f08573;
    --warn: #dfae56;
    --ok: #6bbf93;
    --info: #7aa9dd;
    --violet: #a893f0;
    --teal: #5cb5b0;
    --rose: #e089a8;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  h1, h2, h3 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  /* ---- Demo frame -------------------------------------------------------- */

  .demo-note {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 20px;
    background: var(--ink);
    color: var(--ground);
    font-size: 12px;
  }

  .demo-note strong {
    font-family: var(--display);
    letter-spacing: 0.01em;
  }

  .demo-note span {
    opacity: 0.72;
  }

  /* The point of the whole pitch: the address changes as you move around. */
  .urlbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .urlbar-dots {
    display: flex;
    gap: 5px;
    flex: none;
  }

  .urlbar-dots i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--line-firm);
  }

  .urlbar-field {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--ground);
    font-family: var(--mono);
    font-size: 12.5px;
    overflow: hidden;
  }

  .urlbar-host {
    color: var(--ink-soft);
    flex: none;
  }

  .urlbar-path {
    color: var(--accent);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .copy-btn {
    flex: none;
    padding: 7px 13px;
    border: 1px solid var(--line-firm);
    border-radius: 999px;
    background: var(--surface);
    font-size: 12.5px;
    font-weight: 500;
  }

  .copy-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .copy-btn.done {
    border-color: var(--ok);
    color: var(--ok);
  }

  /* ---- Shell ------------------------------------------------------------- */

  .shell {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr);
    align-items: start;
  }

  .rail {
    position: sticky;
    top: 57px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    padding: 24px 18px 30px;
    border-right: 1px solid var(--line);
    min-height: calc(100vh - 57px);
  }

  .brand {
    font-family: var(--display);
    font-size: 23px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }

  .brand em {
    display: block;
    margin-top: 5px;
    font: 500 10px/1.4 var(--body);
    font-style: normal;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .nav-group {
    padding: 0 10px 7px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .nav-group:not(:first-child) {
    padding-top: 18px;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 7px;
    font-weight: 500;
    color: var(--ink-mid);
  }

  .nav-link:hover {
    background: var(--surface-2);
    color: var(--ink);
  }

  .nav-link.on {
    background: var(--accent-wash);
    color: var(--accent);
  }

  .nav-link b {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }

  .nav-link.on b {
    color: var(--accent);
  }

  .rail-foot {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .as-label {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line-firm);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
  }

  main {
    min-width: 0;
    padding: 30px 34px 90px;
  }

  /* ---- Page furniture ---------------------------------------------------- */

  .head {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 18px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    margin-top: 7px;
    font-size: 36px;
    line-height: 1.04;
    letter-spacing: -0.038em;
  }

  .lede {
    margin: 9px 0 0;
    max-width: 60ch;
    color: var(--ink-mid);
  }

  .crumb {
    display: flex;
    gap: 7px;
    margin-bottom: 12px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .crumb a:hover {
    color: var(--accent);
  }

  h2 {
    font-size: 17px;
    letter-spacing: -0.02em;
  }

  .sec {
    margin-bottom: 30px;
  }

  .sec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 11px;
  }

  .sec-link {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }

  .sec-link:hover {
    text-decoration: underline;
  }

  /* Figures earn a tile only here, where they are the headline. */
  .figures {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    margin-bottom: 30px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .figure {
    padding: 15px 17px;
    background: var(--surface);
  }

  .figure b {
    display: block;
    font-family: var(--display);
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }

  .figure span {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .figure.hot b {
    color: var(--late);
  }

  /* ---- Rows -------------------------------------------------------------- */

  .rows {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }

  .row {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) auto;
    gap: 15px;
    align-items: center;
    padding: 11px 16px;
    border-top: 1px solid var(--line);
  }

  .row:first-child {
    border-top: none;
  }

  a.row:hover {
    background: var(--surface-2);
  }

  .when {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-mid);
    font-variant-numeric: tabular-nums;
  }

  .when i {
    display: block;
    margin-top: 1px;
    font: 400 10.5px/1.4 var(--body);
    font-style: normal;
    color: var(--ink-soft);
  }

  .when.hot,
  .when.hot i {
    color: var(--late);
    font-weight: 500;
  }

  .row-title {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row-meta {
    margin-top: 2px;
    font-size: 12px;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .none {
    padding: 24px 16px;
    border: 1px dashed var(--line-firm);
    border-radius: 10px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ---- State chips ------------------------------------------------------- */

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    background: color-mix(in srgb, var(--c) 14%, transparent);
    color: color-mix(in srgb, var(--c) 72%, var(--ink));
  }

  .chip i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--c);
  }

  .who {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .mono-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .face {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    flex: none;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: color-mix(in srgb, var(--c) 20%, var(--surface));
    color: color-mix(in srgb, var(--c) 70%, var(--ink));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent);
  }

  .face.big {
    width: 44px;
    height: 44px;
    font-size: 15px;
  }

  /* ---- Filters ----------------------------------------------------------- */

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px 14px;
    padding: 13px 15px;
    margin-bottom: 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field > span {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .field select {
    min-width: 138px;
  }

  .toggles {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .toggle {
    padding: 6px 11px;
    border: 1px solid var(--line-firm);
    border-radius: 999px;
    background: var(--surface);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-mid);
  }

  .toggle.on {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  /* The accent lightens in dark mode, so an active toggle needs dark label text. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .toggle.on {
      color: #14161a;
    }
  }

  :root[data-theme="dark"] .toggle.on {
    color: #14161a;
  }

  .filters-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---- Table ------------------------------------------------------------- */

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    padding: 10px 13px;
    border-bottom: 1px solid var(--line-firm);
    background: var(--surface-2);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: left;
    white-space: nowrap;
  }

  td {
    padding: 10px 13px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tbody tr:hover {
    background: var(--surface-2);
  }

  td.num {
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  td.num.hot {
    color: var(--late);
    font-weight: 500;
  }

  .link-title {
    font-weight: 500;
  }

  .link-title:hover {
    color: var(--accent);
  }

  /* ---- Calendar ---------------------------------------------------------- */

  .month-nav {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .month-name {
    min-width: 178px;
    text-align: center;
    font-family: var(--display);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.025em;
  }

  .cal {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }

  .cal-head,
  .cal-row {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }

  .cal-head div {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line-firm);
    background: var(--surface-2);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .cell {
    min-height: 112px;
    padding: 6px 7px 8px;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .cell:nth-child(7n + 1) {
    border-left: none;
  }

  .cal-row:first-child .cell {
    border-top: none;
  }

  .cell.pad {
    background: var(--surface-2);
  }

  .cell.rest:not(.pad) {
    background: color-mix(in srgb, var(--surface-2) 45%, var(--surface));
  }

  .cell.now {
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  .cell > b {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .cell.now > b {
    color: var(--accent);
    font-weight: 500;
  }

  .mark {
    display: block;
    padding: 3px 6px;
    border-left: 3px solid var(--c);
    border-radius: 4px;
    background: color-mix(in srgb, var(--c) 11%, transparent);
    font-size: 11px;
    line-height: 1.32;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  a.mark:hover {
    background: color-mix(in srgb, var(--c) 22%, transparent);
  }

  .mark em {
    margin-right: 5px;
    font: 600 9px/1 var(--body);
    font-style: normal;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--c) 78%, var(--ink));
  }

  .more {
    padding-left: 6px;
    font-size: 10px;
    color: var(--ink-soft);
  }

  .key {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-mid);
  }

  .key span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .key i {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--c);
  }

  /* ---- Detail ------------------------------------------------------------ */

  .split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 282px;
    gap: 26px;
    align-items: start;
  }

  .flag {
    padding: 13px 15px;
    margin-bottom: 18px;
    border-left: 3px solid var(--late);
    border-radius: 0 8px 8px 0;
    background: color-mix(in srgb, var(--late) 9%, transparent);
    font-size: 13px;
  }

  .flag strong {
    font-weight: 600;
  }

  .steps {
    margin: 14px 0 0;
    padding: 0;
    list-style: none;
  }

  .step {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 12px;
    padding-bottom: 17px;
    position: relative;
  }

  .step:not(:last-child)::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 17px;
    bottom: 0;
    width: 2px;
    background: var(--line);
  }

  .step i {
    width: 11px;
    height: 11px;
    margin: 4px;
    border-radius: 50%;
    background: var(--ground);
    box-shadow: inset 0 0 0 2px var(--line-firm);
    z-index: 1;
  }

  .step.done i {
    background: var(--ok);
    box-shadow: inset 0 0 0 2px var(--ok);
  }

  .step.here i {
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-wash);
  }

  .step b {
    font-weight: 600;
  }

  .step span {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .panel {
    padding: 16px 17px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }

  .panel + .panel {
    margin-top: 12px;
  }

  dl {
    margin: 0;
  }

  .fact {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }

  .fact:last-child {
    border-bottom: none;
  }

  .fact dt {
    color: var(--ink-soft);
  }

  .fact dd {
    margin: 0;
    font-weight: 500;
    text-align: right;
  }

  .panel-label {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .wide-btn {
    display: block;
    margin-top: 14px;
    padding: 8px;
    border: 1px solid var(--line-firm);
    border-radius: 7px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
  }

  .wide-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .prose p {
    max-width: 62ch;
    color: var(--ink-mid);
  }

  /* ---- Team -------------------------------------------------------------- */

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
    gap: 12px;
  }

  .person {
    display: flex;
    gap: 13px;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }

  .person:hover {
    border-color: var(--line-firm);
  }

  .person b {
    font-weight: 600;
  }

  .person span {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .tallies {
    display: flex;
    gap: 11px;
    margin-top: 9px;
    font-size: 11.5px;
    color: var(--ink-mid);
  }

  .tallies em {
    font-style: normal;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .tallies .bad {
    color: var(--late);
    font-weight: 600;
  }

  /* ---- What's on --------------------------------------------------------- */

  .diary {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .entry {
    display: grid;
    grid-template-columns: 124px minmax(0, 1fr) auto;
    gap: 15px;
    align-items: center;
    padding: 12px 15px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--c);
    border-radius: 0 8px 8px 0;
    background: var(--surface);
  }

  .month-rule {
    margin: 22px 0 11px;
    font-family: var(--display);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-mid);
  }

  .month-rule:first-child {
    margin-top: 0;
  }

  @media (max-width: 1040px) {
    .split {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  @media (max-width: 820px) {
    .shell {
      grid-template-columns: minmax(0, 1fr);
    }

    .rail {
      position: static;
      min-height: 0;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }

    nav {
      flex-direction: row;
      flex-wrap: wrap;
    }

    .nav-group {
      display: none;
    }

    main {
      padding: 22px 16px 70px;
    }

    h1 {
      font-size: 27px;
    }

    .cell {
      min-height: 76px;
    }

    .mark em {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<div class="demo-note">
  <strong>Proof of concept</strong>
  <span
    >Sample schedule, not live data. The address bar below is part of the demo &mdash;
    watch it change as you move around, and copy a link to any view.</span
  >

<div class="urlbar">

    ><span class="urlbar-path" id="url-path">/</span>
  </div>

<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/">Forecasters<br />Hub<em>Content calendar</em></a>
    <nav id="nav"></nav>

      <div class="as-label">Viewing as</div>
      <select id="as"></select>
    </div>
  </aside>
  <main id="view"></main>

<script id="seed" type="application/json">
  __SEED__
</script>

<script>
  const DATA = JSON.parse(document.getElementById("seed").textContent);
  const { people, content, events } = DATA;
  const TODAY = new Date().toISOString().slice(0, 10);

  const STATUS = {
    "not-started": ["Not started", "var(--ink-soft)"],
    "in-progress": ["Writing", "var(--info)"],
    submitted: ["Submitted", "var(--violet)"],
    "in-review": ["In review", "var(--warn)"],
    published: ["Published", "var(--ok)"],
    "at-risk": ["At risk", "var(--late)"],
  };

  const EVENTS = {
    leave: ["Leave", "Leave", "var(--violet)"],
    "public-holiday": ["Public holiday", "Holiday", "var(--teal)"],
    workshop: ["Workshop", "Workshop", "var(--warn)"],
    training: ["Training", "Training", "var(--info)"],
    conference: ["Show / conference", "Show", "var(--rose)"],
  };

  const VERTICALS = [...new Set(content.map((c) => c.vertical))].sort();
  const TYPES = [...new Set(content.map((c) => c.type))].sort();

  /* ---- helpers ---------------------------------------------------------- */

  const esc = (s) =>
    String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const person = (id) => people.find((p) => p.id === id);
  const nameOf = (id) => person(id)?.name ?? "Unassigned";

  function hue(id) {
    let h = 0;
    for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }

  function face(id, big) {
    const p = person(id);
    const label = (p?.name ?? id)
      .split(/\s+/)
      .slice(0, 2)
      .map((w) => w[0].toUpperCase())
      .join("");
    return `<span class="face${big ? " big" : ""}" style="--c:hsl(${hue(id)} 55% 45%)">${label}</span>`;
  }

  const day = (d) => new Date(d + "T00:00:00Z");
  const fmt = (d, o) => (d ? day(d).toLocaleDateString("en-GB", { timeZone: "UTC", ...o }) : "—");
  const short = (d) => fmt(d, { day: "numeric", month: "short" });
  const medium = (d) => fmt(d, { weekday: "short", day: "numeric", month: "short" });
  const long = (d) => fmt(d, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const monthName = (key) =>
    new Date(key + "-01T00:00:00Z").toLocaleDateString("en-GB", {
      month: "long",
      year: "numeric",
      timeZone: "UTC",
    });

  const diffDays = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);

  function rel(d) {
    const n = diffDays(TODAY, d);
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    return n > 0 ? `in ${n} days` : `${-n} days ago`;
  }

  const OPEN = new Set(["not-started", "in-progress", "at-risk"]);
  const isOpen = (c) => OPEN.has(c.status);
  const isLate = (c) => isOpen(c) && c.submissionDate < TODAY;

  const covers = (e, d) => e.startDate <= d && e.endDate >= d;

  /** Region-aware: a Singapore holiday is not a clash for a forecaster in London. */
  function clashes(item) {
    const region = person(item.forecasterId)?.region;
    return events.filter((e) => {
      if (e.type !== "leave" && e.type !== "public-holiday") return false;
      if (!covers(e, item.submissionDate)) return false;
      if (e.personId) return e.personId === item.forecasterId;
      if (!e.region || e.region === "All") return true;
      return e.region === region;
    });
  }

  function eventApplies(e, p) {
    if (!p) return true;
    if (e.personId) return e.personId === p.id;
    if (e.region && e.region !== "All") return e.region === p.region;
    return true;
  }

  function statusChip(s) {
    const [label, colour] = STATUS[s];
    return `<span class="chip" style="--c:${colour}"><i></i>${label}</span>`;
  }

  function eventChip(t) {
    const [label, , colour] = EVENTS[t];
    return `<span class="chip" style="--c:${colour}"><i></i>${label}</span>`;
  }

  /* ---- routing ---------------------------------------------------------- */

  let viewerId = people.find((p) => p.role === "forecaster").id;

  function route() {
    const raw = location.hash.replace(/^#/, "") || "/";
    const [path, qs] = raw.split("?");
    return { parts: path.split("/").filter(Boolean), params: new URLSearchParams(qs || "") };
  }

  function go(path) {
    location.hash = path;
  }

  function setParam(key, value) {
    const { parts, params } = route();
    if (value) params.set(key, value);
    else params.delete(key);
    const qs = params.toString();
    go("/" + parts.join("/") + (qs ? "?" + qs : ""));
  }

  const monthShift = (key, n) => {
    const [y, m] = key.split("-").map(Number);
    const d = new Date(Date.UTC(y, m - 1 + n, 1));
    return d.toISOString().slice(0, 7);
  };

  /* ---- chrome ----------------------------------------------------------- */

  function renderNav() {
    const { parts } = route();
    const here = parts[0] ?? "";
    const me = person(viewerId);
    const scope = me.role === "forecaster" ? content.filter((c) => c.forecasterId === me.id) : content;
    const open = scope.filter(isOpen).length;
    const late = scope.filter(isLate).length;
    const links = [
      ["Your work", null, null, null],
      ["Today", "#/", "", late ? `${late} late` : ""],
      ["Deadlines", "#/deadlines", "deadlines", String(open)],
      ["Calendar", `#/calendar/${TODAY.slice(0, 7)}`, "calendar", ""],
      ["The team", null, null, null],
      ["Forecasters", "#/team", "team", String(people.filter((p) => p.role === "forecaster").length)],
      ["What’s on", "#/whats-on", "whats-on", ""],
    ];
    document.getElementById("nav").innerHTML = links
      .map(([label, href, key, badge]) =>
        href === null
          ? `<div class="nav-group">${label}</div>`
          : `<a class="nav-link${key === here ? " on" : ""}" href="${href}">${label}${
              badge ? `<b>${badge}</b>` : ""
            }</a>`,
      )
      .join("");

    const sel = document.getElementById("as");
    if (!sel.options.length) {
      const group = (role, label) =>
        `<optgroup label="${label}">` +
        people
          .filter((p) => p.role === role)
          .map((p) => `<option value="${p.id}">${esc(p.name)}</option>`)
          .join("") +
        `</optgroup>`;
      sel.innerHTML = group("forecaster", "Forecasters") + group("commissioning-manager", "Commissioning managers");
      sel.addEventListener("change", () => {
        viewerId = sel.value;
        render();
      });
    }
    sel.value = viewerId;
  }

  function renderUrl() {
    const raw = location.hash.replace(/^#/, "") || "/";
    document.getElementById("url-path").textContent = raw;
  }

  document.getElementById("copy").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(location.href);
      btn.textContent = "Link copied";
      btn.classList.add("done");
      setTimeout(() => {
        btn.textContent = "Copy link to this view";
        btn.classList.remove("done");
      }, 1800);
    } catch {
      window.prompt("Copy this link", location.href);
    }
  });

  /* ---- shared partials -------------------------------------------------- */

  function deadlineRow(c, withOwner) {
    const late = isLate(c);
    const r = rel(c.submissionDate);
    const hot = late || r === "today" || r === "tomorrow";
    return `<a class="row" href="#/content/${c.id}">
      <span class="when${hot ? " hot" : ""}">${short(c.submissionDate)}<i>${late ? "late — " + r : r}</i></span>
      <span><span class="row-title">${esc(c.title)}</span>
        <span class="row-meta">${esc(c.type)} · ${esc(c.vertical)} · ${esc(c.season)}${
          withOwner ? " · " + esc(nameOf(c.forecasterId)) : ""
        }</span></span>
      <span>${statusChip(c.status)}</span>
    </a>`;
  }

  /* ---- pages ------------------------------------------------------------ */

  function pageToday() {
    const me = person(viewerId);
    const manager = me.role === "commissioning-manager";
    const scope = manager ? content : content.filter((c) => c.forecasterId === me.id);
    const open = scope.filter(isOpen);
    const late = open.filter(isLate);
    const next = open
      .filter((c) => c.submissionDate >= TODAY)
      .sort((a, b) => a.submissionDate.localeCompare(b.submissionDate));
    const soon = next.filter((c) => diffDays(TODAY, c.submissionDate) <= 14);
    const publishing = scope
      .filter((c) => c.publicationDate >= TODAY)
      .sort((a, b) => a.publicationDate.localeCompare(b.publicationDate))
      .slice(0, 5);
    const diary = events
      .filter((e) => e.endDate >= TODAY)
      .filter((e) => (manager ? true : eventApplies(e, me)))
      .slice(0, 5);
    const flagged = open
      .map((item) => ({ item, hits: clashes(item) }))
      .filter((r) => r.hits.length)
      .slice(0, 3);

    return `
      <div class="head">
        <div>
          <div class="eyebrow">${fmt(TODAY, { weekday: "long", day: "numeric", month: "long" })}</div>
          <h1>Morning, ${esc(me.name.split(" ")[0])}</h1>
          <p class="lede">${
            manager
              ? "Everything in commission across the team, closest deadline first."
              : "Your submission deadlines, what publishes next, and anything in the diary that gets in the way."
          }</p>
        </div>
      </div>

      <div class="figures">
        <div class="figure${late.length ? " hot" : ""}"><b>${late.length}</b><span>Past deadline</span></div>
        <div class="figure"><b>${soon.length}</b><span>Due in 14 days</span></div>
        <div class="figure"><b>${open.length}</b><span>Still to write</span></div>
        <div class="figure"><b>${scope.filter((c) => c.status === "published").length}</b><span>Published</span></div>
      </div>

      ${
        late.length
          ? `<section class="sec"><div class="sec-head"><h2>Past deadline</h2></div>
             <div class="rows">${late.map((c) => deadlineRow(c, manager)).join("")}</div></section>`
          : ""
      }

      <section class="sec">
        <div class="sec-head"><h2>Next up</h2><a class="sec-link" href="#/deadlines">Every deadline →</a></div>
        ${
          next.length
            ? `<div class="rows">${next.slice(0, 6).map((c) => deadlineRow(c, manager)).join("")}</div>`
            : `<div class="none">Nothing outstanding. Enjoy it.</div>`
        }
      </section>

      ${
        flagged.length
          ? `<section class="sec"><div class="sec-head"><h2>Worth a look</h2></div>
            ${flagged
              .map(
                ({ item, hits }) =>
                  `<div class="flag"><a href="#/content/${item.id}"><strong>${esc(item.title)}</strong></a>
                   is due ${short(item.submissionDate)}, inside ${hits
                     .map((h) => esc(h.title.toLowerCase()))
                     .join(" and ")}${
                    item.forecasterId !== me.id ? " for " + esc(nameOf(item.forecasterId)) : ""
                  }.</div>`,
              )
              .join("")}</section>`
          : ""
      }

      <div class="sec" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px">
        <div>
          <div class="sec-head"><h2>Publishing soon</h2></div>
          <div class="rows">${publishing
            .map(
              (c) => `<a class="row" href="#/content/${c.id}">
                <span class="when">${short(c.publicationDate)}<i>${rel(c.publicationDate)}</i></span>
                <span><span class="row-title">${esc(c.title)}</span>
                  <span class="row-meta">${esc(c.vertical)} · ${esc(nameOf(c.forecasterId))}</span></span>
                <span></span></a>`,
            )
            .join("")}</div>
        </div>
        <div>
          <div class="sec-head"><h2>In the diary</h2><a class="sec-link" href="#/whats-on">What’s on →</a></div>
          <div class="rows">${diary
            .map(
              (e) => `<div class="row">
                <span class="when">${short(e.startDate)}<i>${rel(e.startDate)}</i></span>
                <span><span class="row-title">${esc(e.title)}</span>
                  <span class="row-meta">${esc(
                    e.personId ? nameOf(e.personId) : e.location || (e.region ? e.region + " team" : "Everyone"),
                  )}</span></span>
                <span>${eventChip(e.type)}</span></div>`,
            )
            .join("")}</div>
        </div>
      </div>

      ${
        manager
          ? `<section class="sec"><div class="sec-head"><h2>Who’s carrying what</h2>
              <a class="sec-link" href="#/team">The team →</a></div>
             <div class="rows">${people
               .filter((p) => p.role === "forecaster")
               .map((p) => {
                 const theirs = content.filter((c) => c.forecasterId === p.id);
                 const l = theirs.filter(isLate).length;
                 return `<a class="row" href="#/team/${p.id}">
                   <span class="when">${theirs.filter(isOpen).length} open</span>
                   <span><span class="row-title"><span class="who">${face(p.id)}${esc(p.name)}</span></span>
                     <span class="row-meta">${esc(p.vertical)} · ${esc(p.region)}</span></span>
                   <span>${l ? `<span class="chip" style="--c:var(--late)"><i></i>${l} past deadline</span>` : ""}</span>
                 </a>`;
               })
               .join("")}</div></section>`
          : ""
      }`;
  }

  function pageDeadlines(params) {
    const me = person(viewerId);
    const manager = me.role === "commissioning-manager";
    const who = params.get("forecaster") ?? (manager ? "" : me.id);
    const vertical = params.get("vertical") ?? "";
    const type = params.get("type") ?? "";
    const status = params.get("status") ?? "";

    const rows = content
      .filter((c) => (who ? c.forecasterId === who : true))
      .filter((c) => (vertical ? c.vertical === vertical : true))
      .filter((c) => (type ? c.type === type : true))
      .filter((c) => (status ? c.status === status : true))
      .sort((a, b) => a.submissionDate.localeCompare(b.submissionDate));

    const opts = (list, current, blank) =>
      `<option value="">${blank}</option>` +
      list
        .map(
          ([value, label]) =>
            `<option value="${esc(value)}"${value === current ? " selected" : ""}>${esc(label)}</option>`,
        )
        .join("");

    return `
      <div class="head">
        <div>
          <div class="eyebrow">Submission deadlines</div>
          <h1>Deadlines</h1>
          <p class="lede">Every commissioned piece and the date its copy is due. Filter it, then send
            the link — whoever opens it sees the same list.</p>
        </div>
      </div>

      <div class="filters">
        <label class="field"><span>Forecaster</span>
          <select data-filter="forecaster">${opts(
            people.filter((p) => p.role === "forecaster").map((p) => [p.id, p.name]),
            who,
            "Everyone",
          )}</select></label>
        <label class="field"><span>Vertical</span>
          <select data-filter="vertical">${opts(
            VERTICALS.map((v) => [v, v]),
            vertical,
            "All verticals",
          )}</select></label>
        <label class="field"><span>Type</span>
          <select data-filter="type">${opts(
            TYPES.map((t) => [t, t]),
            type,
            "All types",
          )}</select></label>
        <label class="field"><span>Status</span>
          <select data-filter="status">${opts(
            Object.entries(STATUS).map(([k, v]) => [k, v[0]]),
            status,
            "Any status",
          )}</select></label>
        <div class="filters-right">${rows.length} pieces · ${
          rows.filter((c) => c.submissionDate >= TODAY).length
        } still to come</div>
      </div>

      ${
        rows.length
          ? `<div class="table-scroll"><table>
              <thead><tr><th>Due</th><th>Title</th><th>Type</th><th>Vertical</th>
                <th>Season</th><th>Forecaster</th><th>Publishes</th><th>Status</th></tr></thead>
              <tbody>${rows
                .map(
                  (c) => `<tr>
                    <td class="num${isLate(c) ? " hot" : ""}">${short(c.submissionDate)}
                      <div style="font-size:10px;opacity:.7">${rel(c.submissionDate)}</div></td>
                    <td><a class="link-title" href="#/content/${c.id}">${esc(c.title)}</a></td>
                    <td>${esc(c.type)}</td>
                    <td>${esc(c.vertical)}</td>
                    <td class="num">${esc(c.season)}</td>
                    <td><a href="#/team/${c.forecasterId}"><span class="who">${face(
                      c.forecasterId,
                    )}${esc(nameOf(c.forecasterId))}</span></a></td>
                    <td class="num">${short(c.publicationDate)}</td>
                    <td>${statusChip(c.status)}</td></tr>`,
                )
                .join("")}</tbody></table></div>`
          : `<div class="none">Nothing matches those filters.</div>`
      }`;
  }

  function pageCalendar(key, params) {
    const me = person(viewerId);
    const manager = me.role === "commissioning-manager";
    const who = params.get("forecaster") ?? (manager ? "" : me.id);
    const show = {
      submissions: params.get("submissions") !== "0",
      publications: params.get("publications") !== "0",
      events: params.get("events") !== "0",
    };

    const [y, m] = key.split("-").map(Number);
    const first = new Date(Date.UTC(y, m - 1, 1));
    const offset = (first.getUTCDay() + 6) % 7;
    const weeks = [];
    for (let w = 0; w < 6; w++) {
      const row = [];
      for (let d = 0; d < 7; d++) {
        row.push(new Date(Date.UTC(y, m - 1, 1 - offset + w * 7 + d)).toISOString().slice(0, 10));
      }
      weeks.push(row);
    }

    const scope = content.filter((c) => (who ? c.forecasterId === who : true));
    const scopedEvents = events.filter((e) => eventApplies(e, who ? person(who) : null));

    const cellMarks = (date) => {
      const out = [];
      if (show.events) {
        for (const e of scopedEvents) {
          if (!covers(e, date)) continue;
          const [, brief, colour] = EVENTS[e.type];
          out.push(
            `<a class="mark" style="--c:${colour}" href="#/whats-on?type=${e.type}" title="${esc(
              e.title,
            )}"><em>${esc(e.personId ? nameOf(e.personId).split(" ")[0] : brief)}</em>${esc(e.title)}</a>`,
          );
        }
      }
      if (show.submissions) {
        for (const c of scope) {
          if (c.submissionDate === date)
            out.push(
              `<a class="mark" style="--c:var(--late)" href="#/content/${c.id}" title="Due: ${esc(
                c.title,
              )}"><em>Due</em>${esc(c.title)}</a>`,
            );
        }
      }
      if (show.publications) {
        for (const c of scope) {
          if (c.publicationDate === date)
            out.push(
              `<a class="mark" style="--c:var(--ok)" href="#/content/${c.id}" title="Publishes: ${esc(
                c.title,
              )}"><em>Publishes</em>${esc(c.title)}</a>`,
            );
        }
      }
      return out;
    };

    return `
      <div class="head">
        <div>
          <div class="eyebrow">${medium(key + "-01")} — ${medium(
            new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10),
          )}</div>
          <h1>Calendar</h1>
          <p class="lede">Submission deadlines, publication dates and the diary around them. The month
            and the filters live in the address, so this exact view is a link.</p>
        </div>
        <div class="month-nav">
          <button class="toggle" data-month="${monthShift(key, -1)}" aria-label="Previous month">←</button>
          <div class="month-name">${monthName(key)}</div>
          <button class="toggle" data-month="${monthShift(key, 1)}" aria-label="Next month">→</button>
          <button class="toggle" data-month="${TODAY.slice(0, 7)}">Today</button>
        </div>
      </div>

      <div class="filters">
        <label class="field"><span>Forecaster</span>
          <select data-filter="forecaster"><option value="">Everyone</option>${people
            .filter((p) => p.role === "forecaster")
            .map(
              (p) => `<option value="${p.id}"${p.id === who ? " selected" : ""}>${esc(p.name)}</option>`,
            )
            .join("")}</select></label>
        <div class="field"><span>Show</span>
          <div class="toggles">
            <button class="toggle${show.submissions ? " on" : ""}" data-toggle="submissions">Submissions</button>
            <button class="toggle${show.publications ? " on" : ""}" data-toggle="publications">Publications</button>
            <button class="toggle${show.events ? " on" : ""}" data-toggle="events">Diary</button>
          </div>
        </div>
      </div>

      <div class="cal">
        <div class="cal-head">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
          .map((d) => `<div>${d}</div>`)
          .join("")}</div>
        ${weeks
          .map(
            (week) =>
              `<div class="cal-row">${week
                .map((date) => {
                  const marks = cellMarks(date);
                  const wd = day(date).getUTCDay();
                  const cls = [
                    "cell",
                    date.slice(0, 7) === key ? "" : "pad",
                    wd === 0 || wd === 6 ? "rest" : "",
                    date === TODAY ? "now" : "",
                  ]
                    .filter(Boolean)
                    .join(" ");
                  return `<div class="${cls}"><b>${Number(date.slice(8))}</b>${marks
                    .slice(0, 3)
                    .join("")}${
                    marks.length > 3 ? `<span class="more">+${marks.length - 3} more</span>` : ""
                  }</div>`;
                })
                .join("")}</div>`,
          )
          .join("")}
      </div>

      <div class="key">
        <span style="--c:var(--late)"><i></i>Submission due</span>
        <span style="--c:var(--ok)"><i></i>Publication</span>
        ${Object.entries(EVENTS)
          .map(([, [label, , colour]]) => `<span style="--c:${colour}"><i></i>${label}</span>`)
          .join("")}
      </div>`;
  }

  function pageContent(id) {
    const c = content.find((x) => x.id === id);
    if (!c) return `<div class="none">No piece with that reference.</div>`;
    const owner = person(c.forecasterId);
    const hits = clashes(c);
    const submitted = !OPEN.has(c.status);
    const published = c.status === "published";
    const related = content.filter((x) => x.vertical === c.vertical && x.id !== c.id).slice(0, 5);

    return `
      <div class="crumb"><a href="#/deadlines">Deadlines</a><span>/</span>
        <span>${esc(c.vertical)}</span><span>/</span><span>${esc(c.id)}</span></div>

      <div class="head">
        <div>
          <div class="eyebrow">${esc(c.type)} · ${esc(c.season)}</div>
          <h1>${esc(c.title)}</h1>
          <p class="lede">Due with ${esc(nameOf(c.managerId))} on <strong>${long(
            c.submissionDate,
          )}</strong> (${rel(c.submissionDate)}), publishing ${long(c.publicationDate)}.</p>
        </div>
        <div>${statusChip(c.status)}</div>
      </div>

      <div class="split">
        <div class="prose">
          ${
            isLate(c)
              ? `<div class="flag"><strong>This one is past its submission date.</strong> Copy was due ${long(
                  c.submissionDate,
                )} and the status is still ${STATUS[c.status][0].toLowerCase()}.</div>`
              : ""
          }
          ${
            hits.length
              ? `<div class="flag"><strong>Deadline clash.</strong> The submission date falls inside ${hits
                  .map((h) => esc(h.title.toLowerCase()))
                  .join(" and ")}${owner ? " for " + esc(owner.name) : ""}.</div>`
              : ""
          }

          <h2>Where it is</h2>
          <ul class="steps">
            <li class="step ${submitted ? "done" : "here"}"><i></i>
              <div><b>Copy due with the commissioning manager</b>
                <span>${long(c.submissionDate)} · ${rel(c.submissionDate)}</span></div></li>
            <li class="step ${published ? "done" : submitted ? "here" : ""}"><i></i>
              <div><b>Edit and review</b>
                <span>${submitted ? "In hand" : "Once the copy lands"}</span></div></li>
            <li class="step ${published ? "done" : ""}"><i></i>
              <div><b>Live on the platform</b>
                <span>${long(c.publicationDate)}${
                  c.publicationDate >= TODAY ? " · " + rel(c.publicationDate) : ""
                }</span></div></li>
          </ul>

          ${c.notes ? `<h2 style="margin-top:24px">Notes</h2><p>${esc(c.notes)}</p>` : ""}

          <h2 style="margin:24px 0 10px">Also in ${esc(c.vertical)}</h2>
          ${
            related.length
              ? `<div class="rows">${related
                  .map(
                    (r) => `<a class="row" href="#/content/${r.id}">
                      <span class="when">${short(r.publicationDate)}</span>
                      <span><span class="row-title">${esc(r.title)}</span>
                        <span class="row-meta">${esc(r.type)} · ${esc(r.season)}</span></span>
                      <span>${statusChip(r.status)}</span></a>`,
                  )
                  .join("")}</div>`
              : `<div class="none">Nothing else in this vertical.</div>`
          }
        </div>

        <aside>
          <div class="panel">
            <a href="#/team/${c.forecasterId}" style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
              ${face(c.forecasterId, true)}
              <span><b>${esc(owner?.name ?? "")}</b>
                <span style="display:block;font-size:12px;color:var(--ink-soft)">${esc(
                  owner?.vertical ?? "",
                )} · ${esc(owner?.region ?? "")}</span></span>
            </a>
            <dl>
              <div class="fact"><dt>Reference</dt><dd class="mono-tag">${esc(c.id)}</dd></div>
              <div class="fact"><dt>Type</dt><dd>${esc(c.type)}</dd></div>
              <div class="fact"><dt>Vertical</dt><dd>${esc(c.vertical)}</dd></div>
              <div class="fact"><dt>Season</dt><dd>${esc(c.season)}</dd></div>
              <div class="fact"><dt>Submission</dt><dd>${long(c.submissionDate)}</dd></div>
              <div class="fact"><dt>Publication</dt><dd>${long(c.publicationDate)}</dd></div>
              <div class="fact"><dt>Commissioned by</dt><dd>${esc(nameOf(c.managerId))}</dd></div>
            </dl>
            <a class="wide-btn" href="#/calendar/${c.submissionDate.slice(0, 7)}?forecaster=${
              c.forecasterId
            }">See this month</a>
          </div>
          ${
            hits.length
              ? `<div class="panel"><div class="panel-label">Around the deadline</div>${hits
                  .map(
                    (h) =>
                      `<div style="margin-bottom:8px">${eventChip(h.type)}
                       <div style="font-size:12px;color:var(--ink-mid);margin-top:3px">${esc(
                         h.title,
                       )} · ${long(h.startDate)}</div></div>`,
                  )
                  .join("")}</div>`
              : ""
          }
        </aside>
      </div>`;
  }

  function pageTeam() {
    return `
      <div class="head">
        <div>
          <div class="eyebrow">${people.filter((p) => p.role === "forecaster").length} forecasters</div>
          <h1>The team</h1>
          <p class="lede">Each forecaster has their own page — their deadlines, their leave, and a
            link they can bookmark.</p>
        </div>
      </div>
      <div class="cards">${people
        .filter((p) => p.role === "forecaster")
        .map((p) => {
          const theirs = content.filter((c) => c.forecasterId === p.id);
          const late = theirs.filter(isLate).length;
          const next = theirs
            .filter((c) => isOpen(c) && c.submissionDate >= TODAY)
            .sort((a, b) => a.submissionDate.localeCompare(b.submissionDate))[0];
          return `<a class="person" href="#/team/${p.id}">${face(p.id, true)}
            <span style="min-width:0"><b>${esc(p.name)}</b>
              <span>${esc(p.vertical)} · ${esc(p.region)}</span>
              <span class="tallies"><span><em>${theirs.filter(isOpen).length}</em> open</span>
                <span><em>${theirs.length}</em> commissioned</span>
                ${late ? `<span class="bad">${late} late</span>` : ""}</span>
              ${
                next
                  ? `<span style="margin-top:7px">Next: ${short(next.submissionDate)} · ${rel(
                      next.submissionDate,
                    )}</span>`
                  : ""
              }</span></a>`;
        })
        .join("")}</div>`;
  }

  function pageMember(id) {
    const p = person(id);
    if (!p) return `<div class="none">No forecaster with that id.</div>`;
    const theirs = content
      .filter((c) => c.forecasterId === id)
      .sort((a, b) => a.submissionDate.localeCompare(b.submissionDate));
    const diary = events.filter((e) => eventApplies(e, p) && e.endDate >= TODAY);

    return `
      <div class="crumb"><a href="#/team">The team</a><span>/</span><span>${esc(p.name)}</span></div>
      <div class="head">
        <div style="display:flex;gap:15px;align-items:center">
          ${face(p.id, true)}
          <div><div class="eyebrow">${esc(p.vertical)} · ${esc(p.region)}</div><h1>${esc(p.name)}</h1></div>
        </div>
        <a class="toggle" href="#/calendar/${TODAY.slice(0, 7)}?forecaster=${p.id}">Their calendar</a>
      </div>

      <div class="figures">
        <div class="figure${theirs.filter(isLate).length ? " hot" : ""}">
          <b>${theirs.filter(isLate).length}</b><span>Past deadline</span></div>
        <div class="figure"><b>${theirs.filter(isOpen).length}</b><span>Still to write</span></div>
        <div class="figure"><b>${theirs.filter((c) => c.status === "published").length}</b><span>Published</span></div>
        <div class="figure"><b>${theirs.length}</b><span>Commissioned</span></div>
      </div>

      <section class="sec">
        <div class="sec-head"><h2>Deadlines</h2>
          <a class="sec-link" href="#/deadlines?forecaster=${p.id}">Filter the full table →</a></div>
        <div class="rows">${theirs.map((c) => deadlineRow(c, false)).join("")}</div>
      </section>

      <section class="sec">
        <div class="sec-head"><h2>Their diary</h2></div>
        ${
          diary.length
            ? `<div class="rows">${diary
                .map(
                  (e) => `<div class="row">
                    <span class="when">${short(e.startDate)}${
                      e.endDate !== e.startDate ? " – " + short(e.endDate) : ""
                    }</span>
                    <span><span class="row-title">${esc(e.title)}</span>
                      <span class="row-meta">${esc(e.location || e.region || "")}</span></span>
                    <span>${eventChip(e.type)}</span></div>`,
                )
                .join("")}</div>`
            : `<div class="none">Nothing booked in.</div>`
        }
      </section>`;
  }

  function pageWhatsOn(params) {
    const type = params.get("type") ?? "";
    const rows = events
      .filter((e) => (type ? e.type === type : true))
      .filter((e) => e.endDate >= TODAY)
      .sort((a, b) => a.startDate.localeCompare(b.startDate));

    const byMonth = new Map();
    for (const e of rows) {
      const k = e.startDate.slice(0, 7);
      byMonth.set(k, [...(byMonth.get(k) ?? []), e]);
    }

    return `
      <div class="head">
        <div>
          <div class="eyebrow">Leave · holidays · workshops · shows</div>
          <h1>What’s on</h1>
          <p class="lede">Everything that sits alongside the deadlines, so nobody plans a submission
            for a week they are away.</p>
        </div>
      </div>

      <div class="filters">
        <div class="field"><span>Type</span>
          <div class="toggles">
            <button class="toggle${type ? "" : " on"}" data-type="">Everything</button>
            ${Object.entries(EVENTS)
              .map(
                ([k, [label]]) =>
                  `<button class="toggle${type === k ? " on" : ""}" data-type="${k}">${label}</button>`,
              )
              .join("")}
          </div>
        </div>
        <div class="filters-right">${rows.length} coming up</div>
      </div>

      ${
        rows.length
          ? [...byMonth.entries()]
              .map(
                ([k, list]) =>
                  `<div class="month-rule">${monthName(k)}</div><div class="diary">${list
                    .map(
                      (e) => `<div class="entry" style="--c:${EVENTS[e.type][2]}">
                        <span class="when">${medium(e.startDate)}${
                          e.endDate !== e.startDate
                            ? `<i>to ${medium(e.endDate)}</i>`
                            : ""
                        }</span>
                        <span><span class="row-title">${esc(e.title)}</span>
                          <span class="row-meta">${esc(
                            e.personId
                              ? nameOf(e.personId)
                              : e.region
                                ? e.region + " team"
                                : e.location || "Everyone",
                          )}${e.location && e.personId ? " · " + esc(e.location) : ""}</span></span>
                        <span>${eventChip(e.type)}</span></div>`,
                    )
                    .join("")}</div>`,
              )
              .join("")
          : `<div class="none">Nothing in the diary for that filter.</div>`
      }`;
  }

  /* ---- render ----------------------------------------------------------- */

  function render() {
    const { parts, params } = route();
    const view = document.getElementById("view");
    let html;

    switch (parts[0]) {
      case undefined:
        html = pageToday();
        break;
      case "deadlines":
        html = pageDeadlines(params);
        break;
      case "calendar":
        html = pageCalendar(/^\d{4}-\d{2}$/.test(parts[1] ?? "") ? parts[1] : TODAY.slice(0, 7), params);
        break;
      case "content":
        html = pageContent(parts[1]);
        break;
      case "team":
        html = parts[1] ? pageMember(parts[1]) : pageTeam();
        break;
      case "whats-on":
        html = pageWhatsOn(params);
        break;
      default:
        html = pageToday();
    }

    view.innerHTML = html;
    renderNav();
    renderUrl();

    view.querySelectorAll("[data-filter]").forEach((el) =>
      el.addEventListener("change", () => setParam(el.dataset.filter, el.value)),
    );
    view.querySelectorAll("[data-toggle]").forEach((el) =>
      el.addEventListener("click", () => {
        const on = el.classList.contains("on");
        setParam(el.dataset.toggle, on ? "0" : "");
      }),
    );
    view.querySelectorAll("[data-month]").forEach((el) =>
      el.addEventListener("click", () => {
        const { params: p } = route();
        const qs = p.toString();
        go(`/calendar/${el.dataset.month}` + (qs ? "?" + qs : ""));
      }),
    );
    view.querySelectorAll("[data-type]").forEach((el) =>
      el.addEventListener("click", () => setParam("type", el.dataset.type)),
    );
    window.scrollTo({ top: 0 });
  }

  window.addEventListener("hashchange", render);
  render();
</script>
