<!doctype html>
<!--
  The wash is on until the server says otherwise. Declared here rather than
  left to the appearance hook so the first paint already has it: coming up
  grey and then turning iridescent a moment later looks like a bug, and the
  overwhelming majority of loads are going to end up on anyway.
-->
<html lang="en-GB" data-gradients="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forecasters Hub</title>
    <meta
      name="description"
      content="Publication and submission dates, leave, holidays and workshops for the forecast team."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
